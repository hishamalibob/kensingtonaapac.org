@font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url(/fonts/figtree-latin-600-normal.woff2) format("woff2"); }
:root { --paper: #ffffff; --ink: #171a19; --soft: #4a5650; --btn: #17683f; --btn-ink: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --paper: #111513; --ink: #edf2ee; --soft: #a9b6ae; --btn: #63c891; --btn-ink: #0b2417; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Figtree, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
.flag { display: grid; grid-template-rows: repeat(3, 8px); width: 40px; border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.flag i:nth-child(1) { background: #c8102e; } .flag i:nth-child(2) { background: #0c0c0c; } .flag i:nth-child(3) { background: #0a7a3d; }
h1 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 2rem; line-height: 1.15; margin: 0 0 10px; }
p { color: var(--soft); margin: 0 0 22px; line-height: 1.5; }
main > a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 10px; background: var(--btn); color: var(--btn-ink); font-weight: 600; text-decoration: none; }
.quick { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.quick a { display: inline-block; padding: 8px 0; color: var(--btn); font-weight: 600; }
</style>
