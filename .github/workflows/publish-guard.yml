name: Publish guard

# Runs every time files are published to this repository. It checks that the
# new files would not break the site: the page is whole, every photo, font and
# file the page uses is there, the scripts run, the calendar is valid and the
# address file (CNAME) is in place.
#
# If the files are broken it waits three minutes, in case an upload is still
# under way, and looks again. If they are still broken it puts the last
# working version back with a new commit and opens an issue that says what
# was wrong. Nothing is deleted: the undone change stays in the history.
#
# To publish something the check wrongly objects to, put [skip-check] in the
# commit message.
#
# "Run workflow" on the Actions tab starts a fire drill instead: it breaks a
# practice copy of the site on a side branch and confirms the guard repairs
# it. The live site is not touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  actions: write

concurrency:
  group: publish-guard
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  guard:
    name: Check what was published
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the site files
        run: git clone -q --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Check the new files, and put the last working version back if they are broken
        working-directory: repo
        run: bash .github/scripts/guard.sh main

      - name: Look at the live site once the new files are out
        shell: bash
        run: |
          set +e
          sleep 150
          gh workflow run site-check.yml --ref main && echo "Asked for a site check."
          exit 0

  drill:
    name: Fire drill
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the site files
        run: git clone -q --depth 50 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Break a practice copy and confirm the guard repairs it
        working-directory: repo
        shell: bash
        run: |
          set +e -u
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          good="$(git rev-parse HEAD)"

          # A practice branch, never the live one.
          git checkout -q -B guard-drill
          printf '<html><body>broken on purpose for the drill' > index.html
          git rm -q CNAME
          git commit -qam "Drill: a broken publish (practice branch only)"
          git push -q -f origin guard-drill || { say "FAILED: could not create the practice branch."; exit 1; }

          GUARD_WAIT=5 GUARD_ISSUES=0 bash .github/scripts/guard.sh guard-drill
          rc=$?

          git fetch -q origin "+refs/heads/guard-drill:refs/remotes/origin/guard-drill"
          ok=1
          if [ "$rc" -ne 0 ]; then say "FAILED: the guard stopped with status $rc."; ok=0; fi
          if git diff --quiet "$good" origin/guard-drill -- . ':(exclude).github'; then
            say "Worked: the guard put every site file back exactly as it was."
          else
            say "FAILED: the practice copy does not match the working version."; ok=0
          fi
          if [ "$(git log -1 --format=%s origin/guard-drill)" = "Restore the last working version" ]; then
            say "Worked: the repair was saved as a new commit, with the broken one kept in the history."
          else
            say "FAILED: the repair commit is missing."; ok=0
          fi
          git push -q origin --delete guard-drill || say "Note: could not remove the practice branch. It is safe to delete by hand."
          git fetch -q origin "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse origin/main)" = "$good" ]; then
            say "Worked: the live branch was not touched."
          else
            say "Note: the live branch changed during the drill (someone published)."
          fi
          [ "$ok" = 1 ] && say "Drill passed."
          [ "$ok" = 1 ]
